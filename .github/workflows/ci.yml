name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure host tests
        run: cmake -S tests/host -B .build/host
      - name: Build host tests
        run: cmake --build .build/host --parallel 2
      - name: Run host tests
        run: ctest --test-dir .build/host --output-on-failure

  firmware-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned PlatformIO Core
        run: python -m pip install platformio==6.2.0
      - name: Build Blade
        run: pio run -d firmware/blade -e blade
      - name: Build Computer
        run: pio run -d firmware/computer -e computer
